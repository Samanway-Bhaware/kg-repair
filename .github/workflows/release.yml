# Publish kgrepair as an installable package.
#
# Push a tag that matches the package version and this builds the sdist + wheel,
# attaches them to a GitHub Release, and -- if you opt in -- uploads them to PyPI:
#
#     git tag v0.5.0 && git push origin v0.5.0
#
# The GitHub Release step needs no setup at all. Users can then install with:
#
#     pip install https://github.com/Samanway-Bhaware/kg-repair/releases/download/v0.5.0/kgrepair-0.5.0-py3-none-any.whl
#
# To ALSO publish to PyPI, do these two things once:
#   1. On PyPI, add a Trusted Publisher for this repo with workflow `release.yml`
#      and environment `pypi`  (https://pypi.org/manage/account/publishing/).
#   2. In this repo, set the variable PUBLISH_TO_PYPI to `true`
#      (Settings -> Secrets and variables -> Actions -> Variables).
# Until then the PyPI job is skipped, so tagging never fails on missing credentials.
# No API tokens are involved: publishing uses OIDC.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Check the tag matches kgrepair.__version__
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        # Read the version straight from the source; no install needed, and it
        # is the same attribute pyproject.toml resolves `dynamic = ["version"]` from.
        pkg=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/kgrepair/__init__.py').read_text()).group(1))")
        tag="${GITHUB_REF_NAME#v}"
        echo "tag=$tag  package=$pkg"
        if [ "$pkg" != "$tag" ]; then
          echo "::error::tag ${GITHUB_REF_NAME} does not match kgrepair.__version__ (${pkg}); bump one or the other"
          exit 1
        fi
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check dist/*
        ls -l dist/
    - name: Install the wheel cleanly and exercise it
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install --upgrade pip
        /tmp/smoke/bin/pip install dist/*.whl
        /tmp/smoke/bin/python -c "import kgrepair; print(kgrepair.__version__)"
        /tmp/smoke/bin/kgrepair --help
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  github-release:
    name: Attach distributions to the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to create the release
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - name: Create or update the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="${GITHUB_REF_NAME}"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" dist/* --clobber
        else
          gh release create "$tag" dist/* \
            --title "kgrepair ${tag}" \
            --generate-notes
        fi

  pypi:
    name: Publish to PyPI
    needs: build
    # Opt-in: set the repository variable PUBLISH_TO_PYPI to `true` once the
    # Trusted Publisher is configured. Skipped otherwise, so a tag push still
    # produces a GitHub Release rather than a red run.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kgrepair
    permissions:
      id-token: write          # OIDC token for Trusted Publishing; no API token stored
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
